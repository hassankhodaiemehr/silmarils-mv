[package]
name = "hsbench"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ed25519-dalek = { version = "2", features = ["rand_core", "batch"] }
pqcrypto-mldsa = "0.1"
pqcrypto-falcon = "0.4"
pqcrypto-sphincsplus = "0.7"
sha3 = "0.10"
pqcrypto-traits = "0.3"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
